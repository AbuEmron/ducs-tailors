# Android client build properties.
#
# The absence of this file was why the first CI run failed: AGP refuses to resolve an
# AndroidX classpath unless android.useAndroidX is set, and the error it produces names
# the property rather than the missing file.

android.useAndroidX=true

# R classes carry only the resources a module declares, not its dependencies' too. Smaller
# APK, faster builds, and it surfaces accidental cross-module resource use at compile time.
android.nonTransitiveRClass=true

# Compose and AGP are memory-hungry; the default heap is not enough for a clean build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.code.style=official

# Only the ABIs and densities actually needed. Keeps the debug APK small enough to attach
# to a CI run as an artifact.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
